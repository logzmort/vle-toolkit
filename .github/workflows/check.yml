name: Check toolkit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check numerical methods and data ranges
        run: node tests/vle_engine.test.js
      - name: Check standalone build is current
        run: python3 scripts/build.py --check
